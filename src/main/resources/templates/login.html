<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Inventario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>⚡ Sistema de Inventario</h1>
                <p>Componentes Electrónicos</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>

            <!-- Tabs para Login/Register -->
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('login')">Iniciar Sesión</button>
                <button class="tab-button" onclick="showTab('register')">Registrarse</button>
            </div>

            <!-- Login Form -->
            <div id="login-tab" class="tab-content active">
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Usuario o Email</label>
                        <input type="text" id="login-username" required 
                               placeholder="admin o admin@empresa.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required 
                               placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        Iniciar Sesión
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-tab" class="tab-content">
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Usuario</label>
                        <input type="text" id="reg-username" required 
                               placeholder="john_doe" minlength="3">
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required 
                               placeholder="john@ejemplo.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" required 
                               placeholder="Mínimo 6 caracteres" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="reg-role">Rol</label>
                        <select id="reg-role" required>
                            <option value="ADMIN">Administrador</option>
                            <option value="OPERADOR">Operador</option>
                            <option value="CLIENTE">Cliente</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success btn-block">
                        Crear Cuenta
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <p>💡 Usuarios de prueba:</p>
                <p><strong>admin</strong> / password123 (Administrador)</p>
            </div>
        </div>
    </div>

    <script th:src="@{/js/api-client.js}"></script>
    <script>
        function showTab(tab) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(t => t.classList.remove('active'));
            
            // Mostrar el tab seleccionado
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
            
            // Limpiar mensajes
            hideMessages();
        }

        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            document.getElementById('success-message').style.display = 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(hideMessages, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(hideMessages, 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessages();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('email', data.email);
                    localStorage.setItem('role', data.role);
                    
                    showSuccess('¡Login exitoso! Redirigiendo...');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    const error = await response.json();
                    showError(error.message || 'Credenciales incorrectas');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Verifica que el servidor esté corriendo.');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideMessages();
            
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password, role })
                });

                if (response.ok) {
                    showSuccess('¡Cuenta creada exitosamente! Ahora puedes iniciar sesión.');
                    document.getElementById('register-form').reset();
                    
                    // Cambiar al tab de login después de 2 segundos
                    setTimeout(() => {
                        showTab('login');
                        // Pre-llenar el username
                        document.getElementById('login-username').value = username;
                    }, 2000);
                } else {
                    const error = await response.json();
                    showError(error.message || 'Error al crear la cuenta');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Error de conexión. Verifica que el servidor esté corriendo.');
            }
        }

        // Verificar si ya está logueado
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard';
        }
    </script>
</body>
</html>

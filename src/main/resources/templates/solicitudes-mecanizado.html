<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitudes de Mecanizado - Sistema de Inventario</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>⚡ Inventario</h2>
            <p id="user-info"></p>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard">
                <span class="icon">📊</span> Dashboard
            </a>
            <a href="/componentes">
                <span class="icon">🔌</span> Componentes
            </a>
            <a href="/placas">
                <span class="icon">💾</span> Placas
            </a>
            <a href="/solicitudes-mecanizado" class="active">
                <span class="icon">⚙️</span> Mecanizado
            </a>
            <a href="/solicitudes-armado">
                <span class="icon">🔧</span> Armado
            </a>
            <a href="/tareas">
                <span class="icon">✓</span> Tareas
            </a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="logout()" class="btn btn-danger btn-block">
                Cerrar Sesión
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>⚙️ Solicitudes de Mecanizado</h1>
            <div class="header-actions">
                <button onclick="openCreateModal()" class="btn btn-primary" id="btn-nueva-solicitud">
                    + Nueva Solicitud
                </button>
            </div>
        </div>

        <!-- Filtros -->
        <div class="card">
            <div class="card-body">
                <div class="filter-row">
                    <input type="text" id="search-input" placeholder="Buscar por nombre de placa..."
                           oninput="filterSolicitudes()" class="form-control">
                    <select id="estado-filter" onchange="filterSolicitudes()" class="form-control">
                        <option value="">Todos los estados</option>
                        <option value="SOLICITADO">Solicitado</option>
                        <option value="EN_PROCESO">En Proceso</option>
                        <option value="COMPLETADO">Completado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tabla de solicitudes -->
        <div class="card">
            <div class="card-body">
                <table class="table" id="solicitudes-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre Placa</th>
                            <th>Cliente</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Estado</th>
                            <th>Fecha Creación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="solicitudes-tbody">
                        <tr>
                            <td colspan="8" class="text-center">Cargando solicitudes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Crear/Editar -->
    <div id="solicitud-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Nueva Solicitud de Mecanizado</h3>
                <button onclick="closeModal()" class="close-btn">&times;</button>
            </div>
            <form id="solicitud-form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="nombrePlaca">Nombre de la Placa *</label>
                    <input type="text" id="nombrePlaca" required class="form-control">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" rows="3" class="form-control"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cantidad">Cantidad *</label>
                        <input type="number" id="cantidad" required min="1" value="1" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="precio">Precio *</label>
                        <input type="number" id="precio" required min="0" step="0.01" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label for="especificacionesTecnicas">Especificaciones Técnicas</label>
                    <textarea id="especificacionesTecnicas" rows="3" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label for="gerberFile">Archivo Gerber</label>
                    <input type="file" id="gerberFile" accept=".zip,.rar,.gbr" class="form-control">
                    <small class="form-text">Archivos .zip, .rar o .gbr (máx. 10MB)</small>
                </div>
                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" rows="2" class="form-control"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ver Detalle -->
    <div id="detalle-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalle de Solicitud</h3>
                <button onclick="closeDetalleModal()" class="close-btn">&times;</button>
            </div>
            <div id="detalle-content" class="modal-body">
                <!-- Se llenará dinámicamente -->
            </div>
            <div class="modal-footer">
                <button onclick="closeDetalleModal()" class="btn btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/api-client.js}"></script>
    <script>
        let allSolicitudes = [];
        let editingId = null;
        const userRole = localStorage.getItem('role');

        // Mostrar botón solo para CLIENTE
        if (userRole !== 'CLIENTE') {
            document.getElementById('btn-nueva-solicitud').style.display = 'none';
        }

        async function loadSolicitudes() {
            try {
                const data = await apiGet('/api/solicitudes-mecanizado');
                allSolicitudes = data;
                renderSolicitudes(data);
            } catch (error) {
                showNotification('Error al cargar solicitudes', 'error');
            }
        }

        function renderSolicitudes(solicitudes) {
            const tbody = document.getElementById('solicitudes-tbody');
            
            if (solicitudes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">No hay solicitudes de mecanizado</td></tr>';
                return;
            }

            tbody.innerHTML = solicitudes.map(sol => `
                <tr>
                    <td>${sol.id}</td>
                    <td>${sol.nombrePlaca}</td>
                    <td>${sol.clienteNombre}</td>
                    <td>${sol.cantidad}</td>
                    <td>$${sol.precio.toFixed(2)}</td>
                    <td>
                        <span class="badge badge-${getEstadoBadge(sol.estado)}">
                            ${sol.estado.replace('_', ' ')}
                        </span>
                    </td>
                    <td>${new Date(sol.createdAt).toLocaleDateString()}</td>
                    <td>
                        <button onclick="verDetalle(${sol.id})" class="btn btn-sm btn-info">
                            👁️ Ver
                        </button>
                        ${getAccionButtons(sol)}
                    </td>
                </tr>
            `).join('');
        }

        function getEstadoBadge(estado) {
            const badges = {
                'SOLICITADO': 'warning',
                'EN_PROCESO': 'info',
                'COMPLETADO': 'success',
                'CANCELADO': 'danger'
            };
            return badges[estado] || 'secondary';
        }

        function getAccionButtons(solicitud) {
            const username = localStorage.getItem('username');
            const isOwner = solicitud.clienteNombre === username;
            
            let buttons = '';
            
            // Solo admin/operador pueden cambiar estado
            if (userRole === 'ADMIN' || userRole === 'OPERADOR') {
                if (solicitud.estado === 'SOLICITADO') {
                    buttons += `<button onclick="cambiarEstado(${solicitud.id}, 'EN_PROCESO')" class="btn btn-sm btn-primary">Iniciar</button>`;
                }
                if (solicitud.estado === 'EN_PROCESO') {
                    buttons += `<button onclick="cambiarEstado(${solicitud.id}, 'COMPLETADO')" class="btn btn-sm btn-success">Completar</button>`;
                }
            }
            
            // Admin puede eliminar
            if (userRole === 'ADMIN') {
                buttons += `<button onclick="deleteSolicitud(${solicitud.id})" class="btn btn-sm btn-danger">🗑️</button>`;
            }
            
            return buttons;
        }

        function filterSolicitudes() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const estado = document.getElementById('estado-filter').value;

            const filtered = allSolicitudes.filter(sol => {
                const matchesSearch = sol.nombrePlaca.toLowerCase().includes(searchTerm);
                const matchesEstado = !estado || sol.estado === estado;
                return matchesSearch && matchesEstado;
            });

            renderSolicitudes(filtered);
        }

        function openCreateModal() {
            editingId = null;
            document.getElementById('modal-title').textContent = 'Nueva Solicitud de Mecanizado';
            document.getElementById('solicitud-form').reset();
            document.getElementById('solicitud-modal').style.display = 'block';
        }

        async function verDetalle(id) {
            try {
                const sol = await apiGet(`/api/solicitudes-mecanizado/${id}`);
                const content = `
                    <div class="detail-grid">
                        <div><strong>ID:</strong> ${sol.id}</div>
                        <div><strong>Nombre Placa:</strong> ${sol.nombrePlaca}</div>
                        <div><strong>Cliente:</strong> ${sol.clienteNombre}</div>
                        <div><strong>Estado:</strong> <span class="badge badge-${getEstadoBadge(sol.estado)}">${sol.estado}</span></div>
                        <div><strong>Cantidad:</strong> ${sol.cantidad}</div>
                        <div><strong>Precio:</strong> $${sol.precio.toFixed(2)}</div>
                        <div><strong>Descripción:</strong> ${sol.descripcion || '-'}</div>
                        <div><strong>Especificaciones:</strong> ${sol.especificacionesTecnicas || '-'}</div>
                        <div><strong>Observaciones:</strong> ${sol.observaciones || '-'}</div>
                        ${sol.gerberFileUrl ? `<div><strong>Archivo Gerber:</strong> <a href="${sol.gerberFileUrl}" target="_blank">Descargar</a></div>` : ''}
                        <div><strong>Fecha Creación:</strong> ${new Date(sol.createdAt).toLocaleString()}</div>
                        <div><strong>Última Actualización:</strong> ${new Date(sol.updatedAt).toLocaleString()}</div>
                    </div>
                `;
                document.getElementById('detalle-content').innerHTML = content;
                document.getElementById('detalle-modal').style.display = 'block';
            } catch (error) {
                showNotification('Error al cargar detalle', 'error');
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData();
            formData.append('nombrePlaca', document.getElementById('nombrePlaca').value);
            formData.append('descripcion', document.getElementById('descripcion').value);
            formData.append('cantidad', document.getElementById('cantidad').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('especificacionesTecnicas', document.getElementById('especificacionesTecnicas').value);
            formData.append('observaciones', document.getElementById('observaciones').value);
            
            const gerberFile = document.getElementById('gerberFile').files[0];
            if (gerberFile) {
                formData.append('gerberFile', gerberFile);
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch('/api/solicitudes-mecanizado', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (!response.ok) throw new Error('Error al crear solicitud');
                
                showNotification('Solicitud creada exitosamente', 'success');
                closeModal();
                loadSolicitudes();
            } catch (error) {
                showNotification('Error al guardar solicitud', 'error');
            }
        }

        async function cambiarEstado(id, nuevoEstado) {
            try {
                await apiPut(`/api/solicitudes-mecanizado/${id}/estado`, { estado: nuevoEstado });
                showNotification('Estado actualizado exitosamente', 'success');
                loadSolicitudes();
            } catch (error) {
                showNotification('Error al cambiar estado', 'error');
            }
        }

        async function deleteSolicitud(id) {
            if (!confirm('¿Estás seguro de eliminar esta solicitud?')) return;
            
            try {
                await apiDelete(`/api/solicitudes-mecanizado/${id}`);
                showNotification('Solicitud eliminada exitosamente', 'success');
                loadSolicitudes();
            } catch (error) {
                showNotification('Error al eliminar solicitud', 'error');
            }
        }

        function closeModal() {
            document.getElementById('solicitud-modal').style.display = 'none';
        }

        function closeDetalleModal() {
            document.getElementById('detalle-modal').style.display = 'none';
        }

        // Cargar al iniciar
        loadSolicitudes();
    </script>
</body>
</html>

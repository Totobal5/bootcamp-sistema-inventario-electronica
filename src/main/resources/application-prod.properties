# Configuración de producción para Spring Boot
# Este archivo es usado cuando SPRING_PROFILES_ACTIVE=prod

# Datasource - Railway auto-genera DATABASE_URL en formato PostgreSQL
# DATABASE_URL format: postgresql://user:password@host:port/database
# Spring Boot puede usarlo directamente con formato jdbc:postgresql://
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventario_electronica}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Railway incluye credenciales en DATABASE_URL, no necesitas username/password separados
# Pero si usas SPRING_DATASOURCE_URL personalizado, configura estos:
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Pool de conexiones optimizado para producción
# Railway free tier tiene límites de conexiones
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate - Producción
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Server - Railway/Render usan PORT dinámico
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never

# JWT - IMPORTANTE: Cambiar en producción
jwt.secret=${JWT_SECRET:your-secret-key-min-256-bits-change-this-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Upload de archivos
file.upload-dir=${FILE_UPLOAD_DIR:/app/uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.enabled=true

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Actuator (health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging - Producción (menos verbose)
logging.level.root=WARN
logging.level.com.bootcamp.inventario=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

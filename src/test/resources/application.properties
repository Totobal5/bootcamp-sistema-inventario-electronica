# Configuración para Tests - Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuración JPA para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración JWT (usa valores de prueba)
jwt.secret=testSecretKeyForJWTTokenTestingPurposes12345678901234567890
jwt.expiration=3600000

# Logging
logging.level.org.springframework=WARN
logging.level.com.bootcamp.inventario=DEBUG

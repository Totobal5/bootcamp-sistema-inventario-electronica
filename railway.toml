[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Don't override ENTRYPOINT - let Dockerfile handle it
# Railway will automatically use the ENTRYPOINT from Dockerfile
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Health check configuration
# Spring Boot puede tardar 60-90 segundos en arrancar por primera vez
healthcheckPath = "/actuator/health"
healthcheckTimeout = 600
# Esperar 60 segundos antes del primer healthcheck
healthcheckInitialDelay = 60
